<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CAT SAHWAHITA</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0b1426;--card:#121d35;--ln:#223256;--g:#2AF598;--y:#fff59d;--tx:#e8eefc;--mu:#8fa0c4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}[hidden]{display:none!important}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(circle at 80% 0,#13264a,var(--bg) 60%);color:var(--tx);font:300 15px Poppins,Inter,sans-serif;min-height:100vh}
h1,h2,h3,b,th{font-weight:800}
.wrap{max-width:1100px;margin:0 auto;padding:20px}
.cover{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;align-items:center;min-height:90vh}
@media(max-width:800px){.cover{grid-template-columns:1fr}}
.cover img{width:100%;aspect-ratio:3/1;object-fit:cover;border-radius:16px;border:1px solid var(--ln);box-shadow:0 0 40px #2af59822}
.cover .ph{aspect-ratio:3/1;border-radius:16px;background:var(--card)}
h1{font-size:clamp(26px,4vw,40px);margin:0;line-height:1.15}
.sub{color:var(--g);letter-spacing:.35em;font-weight:700;margin:8px 0 22px;text-align:right}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:20px;margin:14px 0}
input,select{width:100%;padding:12px 14px;margin:6px 0 12px;background:#0c1730;border:1px solid var(--ln);border-radius:10px;color:var(--tx);font:inherit}
input:focus,select:focus{outline:0;border-color:var(--g);box-shadow:0 0 0 3px #2af59833}
label{font-size:12px;color:var(--mu)}
button{font:700 14px Poppins,sans-serif;cursor:pointer;border:0;border-radius:10px;padding:11px 20px;background:var(--g);color:#06231a;transition:.2s}
button:hover{filter:brightness(1.1);box-shadow:0 0 18px #2af59866}
button.s{background:transparent;color:var(--g);border:1px solid var(--g)}button.d{background:#ff5d73;color:#fff}
.err{color:#ff8a9a;font-size:13px;min-height:18px}.ok{color:var(--g)}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.tabs button{background:var(--card);color:var(--tx);border:1px solid var(--ln)}.tabs button.on{background:var(--g);color:#06231a}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:9px 8px;border-bottom:1px solid var(--ln);text-align:left}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pass{color:var(--g)}.fail{color:#ff8a9a}
/* test */
#test{position:fixed;inset:0;background:#050a14;display:flex;align-items:center;justify-content:center;z-index:9}
.stage{width:min(100vw,177.78vh);aspect-ratio:16/9;background:linear-gradient(160deg,#0e1b36,#0a1224);display:flex;flex-direction:column;padding:1.6vmin 2.4vmin;font-size:clamp(11px,1.9vmin,20px)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tm{font:800 2.6vmin Poppins;color:var(--g);text-shadow:0 0 12px #2af59888}
.qa{flex:1;overflow:auto;padding:1vmin 0}
.qt{font-size:2.1vmin;font-weight:400;line-height:1.5;margin-bottom:1.2vmin;white-space:pre-wrap}
.op{display:flex;gap:1.2vmin;align-items:center;width:100%;text-align:left;margin:.7vmin 0;padding:1vmin 1.4vmin;background:#101d38;color:var(--tx);border:1px solid var(--ln);font-weight:300;font-size:1.9vmin}
.op i{font:800 normal 2vmin Poppins;color:var(--g);min-width:2.4vmin}
.op.sel{background:#2b2a12;border-color:var(--y);box-shadow:0 0 14px var(--y),inset 0 0 12px #fff59d44;color:var(--y)}.op.sel i{color:var(--y)}
.nv{display:flex;gap:2vmin;flex-wrap:wrap;margin-top:.6vmin}
.grp{flex:1;min-width:30%;border:1px solid var(--ln);border-radius:10px;padding:.6vmin 1vmin;background:#0c1730}
.grp small{color:var(--g);font-weight:700;font-size:1.5vmin}.grp div{display:flex;flex-wrap:wrap;gap:.3vmin}
.nv button{padding:0;width:3.1vmin;height:2.5vmin;font-size:1.3vmin;background:#14264a;color:var(--tx);border-radius:5px;font-weight:400}
.nv button.dn{background:#173d3a;color:var(--g)}.nv button.cur{outline:2px solid var(--y)}
.ft{display:flex;justify-content:space-between;margin:.8vmin 0}
.big{font:800 40px Poppins;color:var(--g);text-shadow:0 0 20px #2af59888}
.res{display:grid;grid-template-columns:repeat(3,1fr);gap:1.4vmin;margin:1vmin 0}.res>div{background:#0c1730;border:1px solid var(--ln);border-radius:12px;padding:1.2vmin;text-align:center}
/* gambar soal */
.qt img{display:block;max-width:100%;max-height:32vmin;margin:1vmin 0;border-radius:8px;background:#fff;object-fit:contain}
.op img,.card img{max-width:100%;max-height:14vmin;border-radius:6px;background:#fff;vertical-align:middle}
</style></head><body>

function login(m){
 A.innerHTML=`<div class="wrap cover"><div>${BANNER.length>30?`<img src="${BANNER}" alt="SAHWAHITA" onerror="this.outerHTML='<div class=ph></div>'">`:'<div class="ph"></div>'}</div>
 <div><h1>Selamat datang di SAHWAHITA</h1><div class="sub">BIMBEL ONLINE</div>
 <div class="card"><label>User</label><input id="u" autocomplete="username" autocapitalize="none"><label>Password</label><input id="p" type="password" autocomplete="current-password" onkeydown="if(event.key=='Enter')doLogin()">
 <div class="err" id="e">${m||''}</div><button id="lb" onclick="doLogin()" style="width:100%">Masuk</button></div></div></div>`}
async function doLogin(){const u=$('#u').value.trim().toLowerCase(),p=$('#p').value;if(!u||!p)return $('#e').textContent='User dan password wajib diisi.';
 $('#lb').disabled=true;$('#e').textContent='Memeriksa...';
 const{error}=await sb.auth.signInWithPassword({email:u+DOM,password:p});
 if(error){login('User atau password salah / belum didaftarkan admin.');return}
 route()}
async function route(){const{data:{user}}=await sb.auth.getUser();if(!user)return login();
 const{data:pf}=await sb.from('profiles').select('*').eq('id',user.id).single();
 if(!pf){await sb.auth.signOut();return login('Akun belum terdaftar sebagai peserta.')}
 me={id:user.id,u:pf.username,name:pf.name,role:pf.role};me.role==='admin'?admin():home()}
async function out(){await sb.auth.signOut();me=null;login()}

/* ---------- peserta ---------- */
function home(msg){A.innerHTML=`<div class="wrap" style="max-width:640px"><div class="top"><h2>Halo, ${esc(me.name)}</h2><button class="s" onclick="out()">Keluar</button></div>
 <div class="card"><label>Nama</label><input id="nm" value="${esc(me.name)}"><label>TOKEN Try Out</label><input id="tk" placeholder="Masukkan token" style="text-transform:uppercase">
 <div class="err" id="e">${msg||''}</div><button id="sb" onclick="startT()" style="width:100%">Mulai</button></div></div>`}
async function startT(){const nm=$('#nm').value.trim(),tk=$('#tk').value.trim();
 if(!nm||!tk)return $('#e').textContent='Nama dan TOKEN wajib diisi.';
 $('#sb').disabled=true;$('#e').textContent='Memuat soal...';
 const{data:s,error}=await sb.rpc('start_exam',{p_token:tk});
 if(error){home();$('#e').textContent=error.message;return}
 T={s,nm,qs:s.qs,a:{},i:0,end:Date.now()+s.dur*60000,done:false,busy:false};
 $('#test').hidden=false;A.hidden=true;paint();tick=setInterval(()=>{const l=T.end-Date.now();if(l<=0)return finish();const e=$('#tm');if(e)e.textContent=fmt(l)},500)}
const fmt=ms=>{const t=Math.max(0,Math.ceil(ms/1000));return[Math.floor(t/3600),Math.floor(t/60)%60,t%60].map(n=>String(n).padStart(2,'0')).join(':')};
const subOf=i=>T.s.type!=='to'?T.s.type:i<30?'twk':i<65?'tiu':'tkp';
function paint(){const{qs,i,a,s}=T,q=qs[i],L='ABCDE';
 const groups=s.type==='to'?[['TWK',0,30],['TIU',30,65],['TKP',65,110]]:[[NM[s.type],0,qs.length]];
 $('#test').innerHTML=`<div class="stage"><div class="bar"><b>${esc(T.nm)} · ${esc(s.name)}</b><span class="tm" id="tm">${fmt(T.end-Date.now())}</span><button class="d" onclick="if(confirm('Selesaikan ujian sekarang?'))finish()">Selesai</button></div>
 <div class="qa"><div class="qt"><b style="color:var(--g)">${NM[subOf(i)]} · No. ${i+1}/${qs.length}</b><br>${rich(q.q)}</div>
 ${L.split('').filter(c=>q.o[c]!=null).map(c=>`<button class="op ${a[i]===c?'sel':''}" onclick="pick('${c}')"><i>${c}</i><span>${rich(q.o[c])}</span></button>`).join('')}</div>
 <div class="ft"><button class="s" onclick="go(${i-1})" ${i?'':'disabled'}>◀ Back</button>${i<qs.length-1?`<button onclick="go(${i+1})">Next ▶</button>`:`<button class="d" onclick="if(confirm('Selesaikan ujian?'))finish()">Selesai</button>`}</div>
 <div class="nv">${groups.map(g=>`<div class="grp"><small>${g[0]}</small><div>${qs.slice(g[1],Math.min(g[2],qs.length)).map((_,k)=>{const n=g[1]+k;return`<button class="${a[n]?'dn':''} ${n===i?'cur':''}" onclick="go(${n})">${n+1}</button>`}).join('')}</div></div>`).join('')}</div></div>`}
const pick=c=>{T.a[T.i]=c;paint()},go=n=>{T.i=n;paint()};
async function finish(){if(!T||T.busy||T.done)return;T.busy=true;clearInterval(tick);
 $('#test').innerHTML='<div class="stage"><div class="qa" style="display:flex;align-items:center;justify-content:center"><h2>Mengirim jawaban...</h2></div></div>';
 const{data:r,error}=await sb.rpc('submit_exam',{p_sid:T.s.id,p_nm:T.nm,p_ans:T.a});
 if(error){T.busy=false;$('#test').innerHTML=`<div class="stage"><div class="qa" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px"><h2 class="fail">Gagal mengirim jawaban</h2><div>${esc(error.message)}</div><button onclick="finish()">Kirim ulang</button></div></div>`;return}
 T.done=true;T.keys=r.keys;const{sc,subs,ok,tot}=r;
 $('#test').innerHTML=`<div class="stage"><div class="qa" style="text-align:center;display:flex;flex-direction:column;justify-content:center"><div style="color:var(--mu)">${esc(T.nm)} · ${esc(T.s.name)}</div><div>Total Skor</div><div class="big">${tot}</div>
 <div class="res" style="grid-template-columns:repeat(${subs.length},1fr)">${subs.map(k=>`<div><b>${NM[k]}</b><div class="big" style="font-size:40px">${sc[k]}</div><small>PG ${PG[k]} · maks ${MAXS[k]}</small><div class="${sc[k]>=PG[k]?'pass':'fail'}">${sc[k]>=PG[k]?'Di atas PG':'Di bawah PG'}</div></div>`).join('')}</div>
 <h2 class="${ok?'pass':'fail'}">${ok?'Lulus (Selamat Anda Lulus)':'Belum Lulus (Silahkan dicoba lagi sampai lulus)'}</h2>
 <div><button onclick="review()">Lihat Jawaban Benar dan Pembahasan</button> <button class="s" onclick="closeT()">Kembali</button></div></div></div>`;T.rh=$('#test').innerHTML}
function review(){const{qs,a,keys}=T,bst=(k,i)=>subOf(i)==='tkp'?Object.keys(qs[i].o).sort((x,y)=>((k.p||{})[y]||0)-((k.p||{})[x]||0))[0]:k.k;
 $('#test').innerHTML=`<div class="stage"><div class="bar"><b>Jawaban Benar dan Pembahasan</b><button class="s" onclick="$('#test').innerHTML=T.rh">◀ Kembali ke skor</button></div><div class="qa">${qs.map((q,i)=>{const k=keys[i]||{},b=bst(k,i),u=a[i],t=subOf(i)==='tkp';return`<div class="card" style="margin:1vmin 0"><div class="qt"><b style="color:var(--g)">${NM[subOf(i)]} · No. ${i+1}</b><br>${rich(q.q)}</div>${Object.keys(q.o).map(c=>`<div style="padding:.5vmin 1vmin;margin:.3vmin 0;border-radius:8px;border:1px solid ${c===b?'var(--g)':c===u?'#ff5d73':'var(--ln)'};${c===b?'background:#103a2e;':c===u?'background:#3a1420;':''}"><b>${c}.</b> ${rich(q.o[c])}${t&&(k.p||{})[c]?` <small>(${k.p[c]} poin)</small>`:''}${c===u?' <small>← jawaban Anda</small>':''}${c===b?' <small class="pass">✔ jawaban terbaik/benar</small>':''}</div>`).join('')}<div style="margin-top:.8vmin;color:var(--mu)"><b>Jawaban Anda:</b> ${u||'Tidak dijawab'} · <b>Kunci:</b> ${b||'-'}<br><b>Pembahasan:</b> ${esc(k.e)||'Belum ada pembahasan pada file soal.'}</div></div>`}).join('')}</div></div>`}

 if(tab==='peserta'){const{data:u}=await sb.from('profiles').select('*').eq('role','peserta').order('name');
  h+=`<div class="card"><b>Daftarkan peserta</b><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:10px"><div><label>Nama</label><input id="pn"></div><div><label>User (huruf kecil/angka)</label><input id="pu"></div><div><label>Password (min. 6)</label><input id="pp"></div></div><div class="err" id="e"></div><button onclick="addU()">Tambah</button></div>
  <div class="card"><table><tr><th>Nama</th><th>User</th><th></th></tr>${(u||[]).map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.username)}</td><td><button class="s" onclick="resetU('${x.id}')">Reset password</button> <button class="d" onclick="delU('${x.id}')">Hapus</button></td></tr>`).join('')||'<tr><td colspan=3>Belum ada peserta.</td></tr>'}</table></div>`}
 else if(EXP[tab]){const{data:pr}=await sb.from('packages').select('questions').eq('type',tab).maybeSingle();const sv=pr?.questions||[],pd=pend[tab];
  h+=`<div class="card"><b>${NM[tab]} · tersimpan ${sv.length} soal (target ${EXP[tab]})</b><p>Upload file Word (.docx). Format: nomor soal "1.", opsi "A." sampai "E.", kunci "Kunci: B"${tab==='tkp'||tab==='to'?', poin TKP di akhir opsi mis. "(5)" atau baris "Skor: A=1, B=2, ..."':''}. Gambar di dalam Word ikut terbaca.</p>
  <input type="file" id="f" accept=".docx" onchange="up('${tab}',this.files[0])">
  ${pd?`<div class="${pd.warn.length?'fail':'ok'}">Terbaca ${pd.q.length} soal. ${pd.warn.join(' ')}</div><button onclick="saveP('${tab}')">Simpan paket</button> `:''}${sv.length?`<button class="d" onclick="delP('${tab}')">Hapus paket</button>`:''}<div class="err" id="e"></div></div>
  ${(pd?pd.q:sv).slice(0,3).map((x,i)=>`<div class="card"><b>${i+1}.</b> <span style="white-space:pre-wrap">${rich(x.q)}</span><br>${Object.entries(x.o).map(([k,v])=>`<small>${k}. ${rich(v)}</small>`).join('<br>')}</div>`).join('')}
  ${(pd?pd.q:sv).filter(x=>x.q.includes('[[img:')).slice(0,2).length?`<div class="card"><b>Contoh soal bergambar</b>${(pd?pd.q:sv).filter(x=>x.q.includes('[[img:')).slice(0,2).map(x=>`<div style="margin-top:10px;white-space:pre-wrap">${rich(x.q)}</div>`).join('')}</div>`:''}`}
 else if(tab==='sesi'){const{data:ss}=await sb.from('sessions').select('*').order('id',{ascending:false});
  h+=`<div class="card"><b>Buat sesi ujian</b><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:10px"><div><label>Nama sesi</label><input id="sn"></div><div><label>Paket</label><select id="st" onchange="$('#sd').value=DUR[this.value]">${Object.keys(EXP).map(k=>`<option value="${k}">${NM[k]}</option>`).join('')}</select></div><div><label>TOKEN</label><input id="sk" value="${Math.random().toString(36).slice(2,8).toUpperCase()}"></div><div><label>Durasi (menit)</label><input id="sd" type="number" value="120"></div></div><div class="err" id="e"></div><button onclick="addS()">Buat sesi</button></div>
  <div class="card"><table><tr><th>Sesi</th><th>Paket</th><th>TOKEN</th><th>Menit</th><th>Status</th><th></th></tr>${(ss||[]).map(x=>`<tr><td>${esc(x.name)}</td><td>${NM[x.type]}</td><td><b>${esc(x.token)}</b></td><td>${x.dur}</td><td>${x.aktif?'<span class=pass>Aktif</span>':'Nonaktif'}</td><td><button class="s" onclick="togS(${x.id},${!x.aktif})">${x.aktif?'Tutup':'Buka'}</button> <button class="d" onclick="delS(${x.id})">Hapus</button></td></tr>`).join('')||'<tr><td colspan=6>Belum ada sesi.</td></tr>'}</table></div>`}
 else{const{data:rs}=await sb.from('results').select('*').order('created_at',{ascending:false}).limit(500);
  h+=`<div class="card" style="overflow:auto"><table><tr><th>Waktu</th><th>Nama</th><th>Sesi</th><th>TWK</th><th>TIU</th><th>TKP</th><th>Total</th><th>Hasil</th></tr>${(rs||[]).map(r=>`<tr><td>${new Date(r.created_at).toLocaleString('id-ID')}</td><td>${esc(r.nm)}</td><td>${esc(r.ses)}</td>${['twk','tiu','tkp'].map(k=>`<td>${r.subs.includes(k)?r.sc[k]:'-'}</td>`).join('')}<td><b>${r.tot}</b></td><td class="${r.ok?'pass':'fail'}">${r.ok?'Lulus':'Belum Lulus'}</td></tr>`).join('')||'<tr><td colspan=8>Belum ada riwayat.</td></tr>'}</table>${(rs||[]).length?'<br><button class="d" onclick="clearR()">Hapus riwayat</button>':''}</div>`}
 A.innerHTML=h+'</div>'}
const err=m=>{const e=$('#e');if(e)e.textContent=m};
async function fn(b){const{data,error}=await sb.functions.invoke('manage-users',{body:b});
 if(error){let m=error.message;try{m=(await error.context.json()).error||m}catch(e){}return{error:m}}return data}
async function addU(){const b={action:'create',name:$('#pn').value,username:$('#pu').value,password:$('#pp').value};if(!b.name.trim()||!b.username.trim()||!b.password)return err('Semua kolom wajib diisi.');
 err('Menyimpan...');const r=await fn(b);if(r.error)return err(r.error);admin()}
async function delU(id){if(!confirm('Hapus peserta ini beserta riwayatnya?'))return;const r=await fn({action:'delete',id});if(r.error)alert(r.error);admin()}
async function resetU(id){const p=prompt('Password baru (min. 6 karakter):');if(!p)return;const r=await fn({action:'reset',id,password:p});alert(r.error||'Password diganti.')}
async function addS(){const n=$('#sn').value.trim(),k=$('#sk').value.trim();if(!n||!k)return err('Nama sesi dan TOKEN wajib diisi.');
 const{error}=await sb.from('sessions').insert({name:n,type:$('#st').value,token:k,dur:+$('#sd').value||120});if(error)return err(error.message);admin()}
async function togS(id,v){await sb.from('sessions').update({aktif:v}).eq('id',id);admin()}
async function delS(id){await sb.from('sessions').delete().eq('id',id);admin()}
async function clearR(){if(!confirm('Hapus semua riwayat?'))return;await sb.from('results').delete().gte('id',0);admin()}

/* perkecil gambar yang terlalu besar (>350 KB) supaya muat di database */
function shrink(src){return new Promise(res=>{
 if(src.length<350000)return res(src);
 const im=new Image();im.onload=()=>{const k=Math.min(1,900/im.width),c=document.createElement('canvas');
  c.width=im.width*k;c.height=im.height*k;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
  res(c.toDataURL('image/jpeg',.85))};im.onerror=()=>res(src);im.src=src})}

/* upload Word: convertToHtml membawa gambar -> teks bertoken -> parse() */
async function up(t,f){if(!f)return;
 try{
  const buf=await f.arrayBuffer();
  const r=await mammoth.convertToHtml({arrayBuffer:buf},{convertImage:mammoth.images.imgElement(async img=>{
    const b64=await img.read('base64');return{src:await shrink('data:'+img.contentType+';base64,'+b64)}})});
  const d=document.createElement('div');d.innerHTML=r.value;
  d.querySelectorAll('img').forEach(i=>i.replaceWith('\n[[img:'+i.getAttribute('src')+']]\n'));
  d.querySelectorAll('br').forEach(b=>b.replaceWith('\n'));
  d.querySelectorAll('p,li,h1,h2,h3,h4,tr').forEach(p=>p.append('\n'));
  const p=parse(d.textContent,t);
  const n=p.q.filter(q=>q.q.includes('[[img:')||Object.values(q.o).some(o=>o.includes('[[img:'))).length;
  if(n)p.warn.push('Terbaca '+n+' soal bergambar.');
  pend[t]=p;
 }catch(e){console.error(e);pend[t]={q:[],warn:['Gagal membaca file Word: '+e.message]}}
 admin()}
function parse(txt,t){const qs=[];let c=null,last=null;
 const pts=s=>{let m=s.match(/^(.*?)\s*[\[(]\s*(?:skor|poin|nilai)?\s*[:=]?\s*([1-5])\s*(?:poin|pts?)?\s*[\])]\s*$/i);return m?[m[1],+m[2]]:[s,null]};
 txt.split(/\n+/).map(l=>l.trim()).filter(Boolean).forEach(l=>{let m;
  if(c&&(m=l.match(/^(?:kunci(?:\s*jawaban)?|jawaban)\s*[:=]\s*\(?([A-Ea-e])/i)))return c.k=m[1].toUpperCase();
  if(c&&(m=l.match(/^(?:skor|poin|nilai)[^:=]*[:=]\s*(.+)/i))){const p={};[...m[1].matchAll(/([A-Ea-e])\s*[=:\-–]\s*([1-5])/g)].forEach(x=>p[x[1].toUpperCase()]=+x[2]);if(Object.keys(p).length)return Object.assign(c.p,p)}
  if(c&&(m=l.match(/^pembahasan\s*[:=]?\s*(.*)/i))){c.e=m[1];return last='e'}
  if(m=l.match(/^\(?([A-Ea-e])[.)]\s*(.*)/)){if(!c)return;const[x,p]=pts(m[2]),L=m[1].toUpperCase();c.o[L]=x;if(p)c.p[L]=p;return last=L}
  if(m=l.match(/^(\d{1,3})\s*[.)]\s+(.*)/)){c={q:m[2],o:{},k:'',p:{},e:''};qs.push(c);return last='q'}
  if(c){if(last==='q')c.q+='\n'+l;else if(last==='e')c.e+=' '+l;else if(last)c.o[last]+=' '+l}});
 const w=[],n=EXP[t];if(qs.length!==n)w.push(`Jumlah soal harus ${n}.`);
 const nk=qs.filter((q,i)=>!(t==='tkp'||(t==='to'&&i>=65))&&!q.k).length;if(nk)w.push(`${nk} soal tanpa kunci.`);
 const np=qs.filter((q,i)=>(t==='tkp'||(t==='to'&&i>=65))&&Object.keys(q.p).length<Object.keys(q.o).length).length;if(np)w.push(`${np} soal TKP poin opsinya belum lengkap.`);
 return{q:qs,warn:w}}
async function saveP(t){const qs=pend[t].q;err('Menyimpan...');
 const a=await sb.from('packages').upsert({type:t,questions:qs.map(x=>({q:x.q,o:x.o}))});if(a.error)return err(a.error.message);
 const b=await sb.from('package_keys').upsert({type:t,keys:qs.map(x=>({k:x.k,p:x.p,e:x.e}))});if(b.error)return err(b.error.message);
 delete pend[t];admin()}
async function delP(t){if(!confirm('Hapus paket ini?'))return;await sb.from('packages').delete().eq('type',t);await sb.from('package_keys').delete().eq('type',t);admin()}
route();
