<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#050814;--card:rgba(10,10,10,.72);--ln:rgba(255,255,255,.16);--g:#FFC83C;--y:#F4FF8F;--ok:#2AF598;--tx:#e8eefc;--mu:#8fa0c4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}[hidden]{display:none!important}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:linear-gradient(135deg,#0b2260 0%,#050814 45%,#000 62%,#b8901f 100%) fixed;color:var(--tx);font:300 15px Poppins,Inter,sans-serif;min-height:100vh}
h1,h2,h3,b,th{font-weight:800}
.wrap{max-width:1100px;margin:0 auto;padding:20px}
.cover{display:grid;grid-template-columns:1fr 1.1fr;gap:28px;align-items:center;min-height:90vh}
@media(max-width:800px){.cover{grid-template-columns:1fr}}
.cover img{display:block;width:100%;max-width:520px;max-height:80vh;aspect-ratio:1/1;object-fit:contain;margin:0 auto;border:0;border-radius:0;background:none;filter:drop-shadow(0 0 22px rgba(255,200,60,.35))}
.cover .ph{aspect-ratio:3/1;border-radius:16px;background:var(--card)}
h1{font-size:clamp(26px,4vw,40px);margin:0;line-height:1.15}
.sub{color:var(--g);letter-spacing:.04em;font-weight:700;font-size:1.15em;margin:6px 0 18px;text-align:left}
.cover>.card{padding:26px;border-radius:20px;border:1px solid rgba(255,200,60,.35);box-shadow:0 0 30px rgba(255,200,60,.18)}.cover>.card h1{font-size:clamp(22px,2.6vw,34px)}
@media(max-width:800px){.cover img{max-height:38vh}}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:20px;margin:14px 0}
input,select{width:100%;padding:12px 14px;margin:6px 0 12px;background:rgba(255,255,255,.08);border:1px solid var(--ln);border-radius:10px;color:var(--tx);font:inherit}
input:focus,select:focus{outline:0;border-color:var(--g);box-shadow:0 0 0 3px rgba(255,200,60,.3)}
label{font-size:12px;color:var(--mu)}
button{font:700 14px Poppins,sans-serif;cursor:pointer;border:0;border-radius:10px;padding:11px 20px;background:var(--g);color:#1b1400;transition:.2s}
button:hover{filter:brightness(1.1);box-shadow:0 0 18px rgba(255,200,60,.45)}
button.s{background:transparent;color:var(--g);border:1px solid var(--g)}button.d{background:#ff5d73;color:#fff}
.err{color:#ff8a9a;font-size:13px;min-height:18px}.ok{color:var(--ok)}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.tabs button{background:var(--card);color:var(--tx);border:1px solid var(--ln)}.tabs button.on{background:var(--g);color:#1b1400}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:9px 8px;border-bottom:1px solid var(--ln);text-align:left}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pass{color:var(--ok)}.fail{color:#ff8a9a}
/* ===== responsif: HP, tablet, laptop ===== */
html{-webkit-text-size-adjust:100%}
.card{overflow-x:auto}
@media(min-width:1400px){.wrap{max-width:1280px}}
/* layar ujian: memenuhi layar apa pun, ukuran huruf menyesuaikan perangkat */
#test{position:fixed;inset:0;background:#050814;z-index:9;overflow:hidden}
.stage{width:100%;height:100%;display:flex;flex-direction:column;gap:.5em;background:linear-gradient(135deg,#0b2260 0%,#050814 45%,#000 62%,#b8901f 100%);
 padding:max(10px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));
 font-size:clamp(13px,calc(9px + .3vw + .3vh),19px)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:.6em;flex-wrap:wrap;background:var(--card);border-radius:12px;padding:.35em .8em;border:1px solid rgba(255,255,255,.1)}
.bar img{height:2.4em;width:2.4em;object-fit:contain}.bar .lb{font-weight:600;font-size:.85em;color:var(--g);white-space:nowrap}
.bar b{flex:1 1 11em;min-width:0;font-size:.95em;font-weight:700}
.tm{font:800 1.5em Poppins;color:var(--g);text-shadow:0 0 12px rgba(255,200,60,.55)}
.qa{flex:1;min-height:0;overflow:auto;padding:.4em 0;-webkit-overflow-scrolling:touch}
.qt{font-size:1.1em;font-weight:400;line-height:1.55;margin-bottom:.8em;white-space:pre-wrap}
.op{display:flex;gap:.8em;align-items:center;width:100%;text-align:left;margin:.45em 0;padding:.7em .9em;background:rgba(255,255,255,.08);color:var(--tx);border:1px solid var(--ln);font-weight:300;font-size:1em;line-height:1.4}
.op{align-items:flex-start}.op i{font:800 normal .9em Poppins;color:var(--tx);flex:none;width:1.9em;height:1.9em;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.18)}
.op.sel{background:rgba(244,255,143,.16);border-color:var(--y);box-shadow:0 0 16px rgba(244,255,143,.75),inset 0 0 8px rgba(244,255,143,.25);color:var(--y)}.op.sel i{background:var(--y);color:#222}
.nv{display:flex;gap:.7em;flex-wrap:wrap;max-height:32%;overflow:auto}
.grp{flex:1;min-width:0;border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:.4em .6em;background:var(--card)}.grp:nth-child(1){flex:30}.grp:nth-child(2){flex:35}.grp:nth-child(3){flex:45}
.grp small{color:var(--g);font-weight:700;font-size:.8em}.grp div{display:flex;flex-wrap:wrap;gap:.25em}
.nv button{padding:0;width:2.3em;height:1.9em;font-size:.8em;background:rgba(255,255,255,.1);color:var(--tx);border-radius:6px;font-weight:400}
.nv button{border:1px solid rgba(255,255,255,.2);font-weight:600}.nv button.dn{background:#15b86b;border-color:#15b86b;color:#fff}.nv button.cur{background:var(--y);border-color:var(--y);color:#222;box-shadow:0 0 8px rgba(244,255,143,.8)}
.ft{display:flex;justify-content:center;gap:.6em}.ft button.bk{background:rgba(255,200,60,.4);box-shadow:none}.ft button.alt{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.3);box-shadow:none}
button:disabled{opacity:.45;cursor:not-allowed;box-shadow:none;filter:none}
.qa2{flex:1;min-height:0;display:flex;gap:.6em}.qp,.qo{min-height:0;min-width:0;overflow:auto;background:var(--card);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:.8em 1em;-webkit-overflow-scrolling:touch}.qp{flex:38 1 0}.qo{flex:62 1 0}.qp .qt{margin:0}
.tabs2{display:none;gap:.4em}.tabs2 button{flex:1;padding:.5em .3em;font-size:.85em;background:rgba(255,255,255,.1);color:var(--tx);box-shadow:none}.tabs2 button.on{background:var(--g);color:#1b1400}.ft button{min-width:7em}
.big{font:800 40px Poppins;color:var(--g);text-shadow:0 0 20px rgba(255,200,60,.55)}
.res{display:grid;grid-template-columns:repeat(3,1fr);gap:.7em;margin:.6em 0}.res>div{background:rgba(255,255,255,.08);border:1px solid var(--ln);border-radius:12px;padding:.7em;text-align:center}
/* gambar soal */
.qt img{display:block;max-width:100%;max-height:40vh;margin:.6em 0;border-radius:8px;background:#fff;object-fit:contain}
.op img,.card img{max-width:100%;max-height:18vh;border-radius:6px;background:#fff;vertical-align:middle}
/* tabel soal */
.tw{display:block;max-width:100%;overflow-x:auto;margin:.6em 0;white-space:normal}
table.qtb{width:auto;max-width:100%;border-collapse:collapse;font-size:inherit;font-weight:400;background:rgba(255,255,255,.08);border:1px solid var(--ln);border-radius:8px}
.qtb th,.qtb td{border:1px solid var(--ln);padding:.4em .8em;text-align:center;font-weight:400;white-space:nowrap;line-height:1.3}
.qtb th{background:rgba(255,255,255,.1);color:var(--g);font-weight:700;text-align:left}
.card .tw{margin:6px 0}.card .qtb th,.card .qtb td{padding:5px 10px}
/* layar pendek (HP mendatar): seluruh halaman ujian bisa digulir */
@media(max-height:520px){
 .stage{overflow-y:auto;-webkit-overflow-scrolling:touch}
 .qa{flex:none;overflow:visible}
 .qa2{flex:none;align-items:flex-start}.qp,.qo{overflow:visible;max-height:none}
 .nv{max-height:none;overflow:visible}
 .bar{position:sticky;top:0;z-index:2;background:#07101f;padding:.3em .5em}
}
/* laptop dengan layar tidak terlalu tinggi: tombol nomor lebih ringkas */
@media(min-width:701px) and (max-height:820px){.nv button{width:2em;height:1.55em}.nv{max-height:28%}}
/* HP / layar sempit */
@media(orientation:portrait),(max-width:700px){
 .qa2{flex-direction:column}.qp{flex:0 1 auto;max-height:40%}.qo{flex:1 1 0}
}
@media(max-width:700px){
 .stage{font-size:12px}.bar{flex-wrap:nowrap}.bar b{flex:1 1 0;flex-basis:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bar .lb{font-size:.7em}.tm{font-size:1.2em}.tabs2{display:flex}.grp:not(.on){display:none}.grp:nth-child(n){flex:1}
 body{font-size:14px}
 .wrap{padding:14px}
 .card{padding:14px;border-radius:14px}
 input,select{font-size:16px}
 button{padding:10px 14px}
 .top h2{font-size:18px}
 .tabs{gap:6px}.tabs button{padding:9px 12px;font-size:13px}
 table{font-size:12px}td,th{padding:8px 6px}
 .cover{min-height:auto;padding-top:10px}
 .nv{max-height:34%}
 .big{font-size:30px}.res .big{font-size:26px!important}
 .res{gap:.4em}.res>div{padding:.5em .3em}
 .ft button{flex:1}
}
/* penyebab ukuran huruf opsi 'telat': transition .2s pada tombol ikut menganimasi font-size */
.op,.op i,.op span{transition:background-color .15s,border-color .15s,box-shadow .15s}
/* tombol layar penuh */
.fs{padding:.35em .6em;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.3);box-shadow:none;line-height:0;display:inline-grid;place-items:center;font-size:.9em}
#fsb{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:5;font-size:16px;padding:.55em .7em;background:rgba(10,10,10,.75)}
#test:not([hidden])~#fsb{display:none}
/* kotak navigasi & tombol lebih ringkas */
.nv{max-height:24%}.nv button{font-size:.62em;width:2.1em;height:1.6em}.grp{padding:.3em .5em}.grp small{font-size:.7em}.nv .grp>div{gap:.2em}
.ft button{padding:.4em 1.1em;font-size:.8em;min-width:6em}.bar{padding:.25em .7em}.bar img{height:2em;width:2em}.bar b{font-size:.85em}.tm{font-size:1.25em}
@media(min-width:701px) and (max-height:820px){.nv button{width:2em;height:1.5em}.nv{max-height:24%}}
@media(max-width:700px){.nv{max-height:26%}.nv button{font-size:.72em;width:2.1em;height:1.55em}.tabs2 button{font-size:.75em;padding:.4em .2em}}

 else if(EXP[tab]){const{data:pl}=await sb.from('paket_soal').select('id,type,name,jml,created_at').eq('type',tab).order('id',{ascending:false}),pd=pend[tab],L=pl||[];

  ${(pd?pd.q:[]).slice(0,3).map((x,i)=>`<div class="card"><b>${i+1}.</b> <span style="white-space:pre-wrap">${rich(x.q)}</span><br>${Object.entries(x.o).map(([k,v])=>`<small>${k}. ${rich(v)}</small>`).join('<br>')}</div>`).join('')}
  ${(()=>{const M=(pd?pd.q:[]).filter(x=>x.q.includes('[[img:')||x.q.includes('[[tbl:')).slice(0,2);return M.length?`<div class="card"><b>Contoh soal bergambar/bertabel</b>${M.map(x=>`<div style="margin-top:10px;white-space:pre-wrap">${rich(x.q)}</div>`).join('')}</div>`:''})()}`}
 else if(tab==='sesi'){const[r1,r2]=await Promise.all([sb.from('sessions').select('*').order('id',{ascending:false}),sb.from('paket_soal').select('id,type,name,jml').order('id',{ascending:false})]);
  const ss=r1.data,pl=r2.data||[];PL={};pl.forEach(x=>PL[x.id]=x);
  const e=(ss||[]).find(x=>x.id===edS)||null,sp=e&&e.start_at?new Date(e.start_at):null,ep=e&&e.end_at?new Date(e.end_at):null,dv=sp?ymd(sp):'';
  const f0=e&&PL[e.paket_id]?PL[e.paket_id]:pl[0];
  h+=`<div class="card"><b>${e?'Ubah sesi ujian':'Buat sesi ujian'}</b><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:10px">

   <div><label>TOKEN</label><input id="sk" value="${e?esc(e.token):Math.random().toString(36).slice(2,8).toUpperCase()}"></div>

   <b style="display:block;margin-top:6px">Jadwal pelaksanaan</b>
   <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:10px">
   <div><label>Tanggal ujian</label><input id="sdt" type="date" value="${dv}" onchange="const v=this.value;$('#dh').textContent=v?fD(v+'T00:00'):''"><small id="dh" class="ok">${dv?fD(dv+'T00:00'):''}</small></div>
   <div><label>Jam mulai</label><input id="sjm" type="time" value="${sp?hm(sp):''}"></div>
   <div><label>Jam ditutup (opsional)</label><input id="sjs" type="time" value="${ep?hm(ep):''}"></div></div>
   <p><small>Kosongkan tanggal dan jam bila sesi boleh dimulai kapan saja. Peserta hanya bisa memulai di antara jam mulai dan jam ditutup.</small></p>
   <div class="err" id="e"></div><button onclick="addS()">${e?'Simpan perubahan':'Buat sesi'}</button>${e?' <button class="s" onclick="edS=null;admin()">Batal</button>':''}</div>
  <div class="card" style="overflow:auto"><table><tr><th>Sesi</th><th>Paket soal</th><th>TOKEN</th><th>Jadwal</th><th>Menit</th><th>Status</th><th></th></tr>${(ss||[]).map(x=>`<tr><td>${esc(x.name)}</td><td>${PL[x.paket_id]?esc(PL[x.paket_id].name)+'<br><small>'+NM[x.type]+'</small>':'<span class="fail">Paket belum dipilih</span><br><small>'+NM[x.type]+'</small>'}</td><td><b>${esc(x.token)}</b></td><td>${schedTxt(x)}</td><td>${x.dur}</td><td>${schedSt(x)}</td><td style="white-space:nowrap"><button class="s" onclick="edS=${x.id};admin();scrollTo(0,0)">Ubah</button> <button class="s" onclick="togS(${x.id},${!x.aktif})">${x.aktif?'Tutup':'Buka'}</button> <button class="d" onclick="delS(${x.id})">Hapus</button></td></tr>`).join('')||'<tr><td colspan=7>Belum ada sesi.</td></tr>'}</table></div>`}
 else{const{data:rs}=await sb.from('results').select('*').order('created_at',{ascending:false}).limit(500);
  h+=`<div class="card" style="overflow:auto"><table><tr><th>Waktu</th><th>Nama</th><th>Sesi</th><th>TWK</th><th>TIU</th><th>TKP</th><th>Total</th><th>Hasil</th></tr>${(rs||[]).map(r=>`<tr><td>${new Date(r.created_at).toLocaleString('id-ID')}</td><td>${esc(r.nm)}</td><td>${esc(r.ses)}</td>${['twk','tiu','tkp'].map(k=>`<td>${r.subs.includes(k)?r.sc[k]:'-'}</td>`).join('')}<td><b>${r.tot}</b></td><td class="${r.ok?'pass':'fail'}">${r.ok?'Lulus':'Belum Lulus'}</td></tr>`).join('')||'<tr><td colspan=8>Belum ada riwayat.</td></tr>'}</table>${(rs||[]).length?'<br><button class="d" onclick="clearR()">Hapus riwayat</button>':''}</div>`}

const err=m=>{const e=$('#e');if(e)e.textContent=m};
async function fn(b){const{data,error}=await sb.functions.invoke('manage-users',{body:b});
 if(error){let m=error.message;try{m=(await error.context.json()).error||m}catch(e){}return{error:m}}return data}
async function addU(){const b={action:'create',name:$('#pn').value,username:$('#pu').value,password:$('#pp').value};if(!b.name.trim()||!b.username.trim()||!b.password)return err('Semua kolom wajib diisi.');
 err('Menyimpan...');const r=await fn(b);if(r.error)return err(r.error);admin()}
async function delU(id){if(!confirm('Hapus peserta ini beserta riwayatnya?'))return;const r=await fn({action:'delete',id});if(r.error)alert(r.error);admin()}
async function resetU(id){const p=prompt('Password baru (min. 6 karakter):');if(!p)return;const r=await fn({action:'reset',id,password:p});alert(r.error||'Password diganti.')}
async function addS(){const n=$('#sn').value.trim(),k=$('#sk').value.trim();if(!n||!k)return err('Nama sesi dan TOKEN wajib diisi.');
 const d=$('#sdt').value,m=$('#sjm').value,t=$('#sjs').value;
 if((m||t)&&!d)return err('Isi tanggal ujian.');
 if(d&&!m)return err('Isi jam mulai.');
 if(m&&t&&t<=m)return err('Jam ditutup harus lebih akhir dari jam mulai.');
 const pk=PL[+$('#st').value];if(!pk)return err('Pilih paket soal. Unggah paket dulu bila belum ada.');
 const row={name:n,type:pk.type,paket_id:pk.id,token:k,dur:+$('#sd').value||120};
 if(d||edS){row.start_at=d?new Date(d+'T'+m).toISOString():null;row.end_at=d&&t?new Date(d+'T'+t).toISOString():null}
 const{error}=edS?await sb.from('sessions').update(row).eq('id',edS):await sb.from('sessions').insert(row);
 if(error)return err(/start_at|end_at|column/i.test(error.message)?'Kolom jadwal belum ada di database. Jalankan SQL jadwal di Supabase dulu.':error.message);
 edS=null;admin()}
async function togS(id,v){await sb.from('sessions').update({aktif:v}).eq('id',id);admin()}
async function delS(id){await sb.from('sessions').delete().eq('id',id);admin()}
async function clearR(){if(!confirm('Hapus semua riwayat?'))return;await sb.from('results').delete().gte('id',0);admin()}

/* perkecil gambar yang terlalu besar (>350 KB) supaya muat di database */
function shrink(src){return new Promise(res=>{
 if(src.length<350000)return res(src);
 const im=new Image();im.onload=()=>{const k=Math.min(1,900/im.width),c=document.createElement('canvas');
  c.width=im.width*k;c.height=im.height*k;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
  res(c.toDataURL('image/jpeg',.85))};im.onerror=()=>res(src);im.src=src})}

/* upload Word: convertToHtml membawa gambar dan tabel -> teks bertoken -> parse() */
async function up(t,f){if(!f)return;
 try{
  const buf=await f.arrayBuffer();
  const r=await mammoth.convertToHtml({arrayBuffer:buf},{convertImage:mammoth.images.imgElement(async img=>{
    const b64=await img.read('base64');return{src:await shrink('data:'+img.contentType+';base64,'+b64)}})});
  const d=document.createElement('div');d.innerHTML=r.value;
  /* tabel Word -> satu token berisi seluruh baris dan kolom (tidak terpecah per sel) */
  d.querySelectorAll('table').forEach(tb=>{
    const rows=[...tb.querySelectorAll('tr')].map(tr=>[...tr.children].map(c=>c.textContent.replace(/\s+/g,' ').trim())).filter(r=>r.some(Boolean));
    tb.replaceWith('\n[[tbl:'+encodeURIComponent(JSON.stringify(rows))+']]\n')});
  d.querySelectorAll('img').forEach(i=>i.replaceWith('\n[[img:'+i.getAttribute('src')+']]\n'));
  d.querySelectorAll('br').forEach(b=>b.replaceWith('\n'));
  d.querySelectorAll('p,li,h1,h2,h3,h4,tr').forEach(p=>p.append('\n'));
  const p=parse(d.textContent,t);
  const ni=p.q.filter(q=>q.q.includes('[[img:')||Object.values(q.o).some(o=>o.includes('[[img:'))).length;
  const nt=p.q.filter(q=>q.q.includes('[[tbl:')||/(^|\n)[^|\n]+(\s\|\s[^|\n]+)+(\n|$)/.test(q.q)).length;
  if(ni)p.warn.push('Terbaca '+ni+' soal bergambar.');
  if(nt)p.warn.push('Terbaca '+nt+' soal bertabel.');
  pend[t]=p;
 }catch(e){console.error(e);pend[t]={q:[],warn:['Gagal membaca file Word: '+e.message]}}
 admin()}
function parse(txt,t){const qs=[];let c=null,last=null;
 const pts=s=>{let m=s.match(/^(.*?)\s*[\[(]\s*(?:skor|poin|nilai)?\s*[:=]?\s*([1-5])\s*(?:poin|pts?)?\s*[\])]\s*$/i);return m?[m[1],+m[2]]:[s,null]};
 txt.split(/\n+/).map(l=>l.trim()).filter(Boolean).forEach(l=>{let m;
  if(c&&(m=l.match(/^(?:kunci(?:\s*jawaban)?|jawaban)\s*[:=]\s*\(?([A-Ea-e])/i)))return c.k=m[1].toUpperCase();
  if(c&&(m=l.match(/^(?:skor|poin|nilai)[^:=]*[:=]\s*(.+)/i))){const p={};[...m[1].matchAll(/([A-Ea-e])\s*[=:\-–]\s*([1-5])/g)].forEach(x=>p[x[1].toUpperCase()]=+x[2]);if(Object.keys(p).length)return Object.assign(c.p,p)}
  if(c&&(m=l.match(/^pembahasan\s*[:=]?\s*(.*)/i))){c.e=m[1];return last='e'}
  if(c&&(m=l.match(/^\(?([A-E])[.)]\s*(.*)/))&&m[1]==='ABCDE'[Object.keys(c.o).length]){const[x,p]=pts(m[2]),L=m[1];c.o[L]=x;if(p)c.p[L]=p;return last=L}
  if((m=l.match(/^(\d{1,3})\s*[.)]\s+(.*)/))&&(!c||c.k||c.e||Object.keys(c.o).length>=5)){c={q:m[2],o:{},k:'',p:{},e:''};qs.push(c);return last='q'}
  if(c){if(last==='q')c.q+='\n'+l;else if(last==='e')c.e+=' '+l;else if(last)c.o[last]+=' '+l}});
 const w=[],n=EXP[t];if(qs.length!==n)w.push(`Jumlah soal harus ${n}.`);
 const nk=qs.filter((q,i)=>!(t==='tkp'||(t==='to'&&i>=65))&&!q.k).length;if(nk)w.push(`${nk} soal tanpa kunci.`);
 const np=qs.filter((q,i)=>(t==='tkp'||(t==='to'&&i>=65))&&Object.keys(q.p).length<Object.keys(q.o).length).length;if(np)w.push(`${np} soal TKP poin opsinya belum lengkap.`);
 return{q:qs,warn:w}}
async function saveP(t){const qs=pend[t].q;if(!qs.length)return err('Tidak ada soal yang terbaca.');
 const nm=($('#pnm').value||'').trim()||NM[t]+' Paket';err('Menyimpan...');
 const{error}=await sb.from('paket_soal').insert({type:t,name:nm,questions:qs.map(x=>({q:x.q,o:x.o})),keys:qs.map(x=>({k:x.k,p:x.p,e:x.e}))});
 if(error)return err(error.message);delete pend[t];admin()}
async function renameP(id){const n=prompt('Nama paket:',(PL[id]||{}).name||'');if(!n||!n.trim())return;
 const{error}=await sb.from('paket_soal').update({name:n.trim()}).eq('id',id);if(error)alert(error.message);admin()}
async function delP(id){const{count}=await sb.from('sessions').select('id',{count:'exact',head:true}).eq('paket_id',id);
 if(!confirm(count?`Paket ini dipakai ${count} sesi. Jika dihapus, sesi tersebut tidak bisa dimulai sebelum paketnya diganti. Tetap hapus?`:'Hapus paket ini?'))return;
 const{error}=await sb.from('paket_soal').delete().eq('id',id);if(error)alert(error.message);admin()}
route();
